name: Daily job run

# ONE workflow, ONE email a day, for both systems:
#   - Job Link (TypeScript, repository root): LinkedIn + company boards, scoring, application forms filled up to Submit, hiring contacts, drafted notes.
#   - Job Agent (Python, agent/): company boards, research, Gmail drafts, Drive report, and the one daily results email.
# This repository is PUBLIC (free Actions minutes), so nothing personal lives here: the candidate profile, résumés and the database are encrypted
# in the PRIVATE data repository (secret DATA_REPO_TOKEN); Job Link's console output is written to a file and never printed, no artifacts or
# step summaries are published, and no issues are opened. What needs you arrives in the single Job Agent email and in the private reports branch.
#
# Nothing is ever submitted or sent automatically by Job Link. Job Agent's Gmail output is drafts only.
on:
  schedule:
    - cron: '37 0 * * *'  # 06:07 IST - primary run
    - cron: '37 2 * * *'  # 08:07 IST - catch-up if the primary run failed/skipped
    - cron: '37 4 * * *'  # 10:07 IST - catch-up
    - cron: '37 6 * * *'  # 12:07 IST - last-chance catch-up before the 14:00 window end
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Job Agent: force a real run now (ignore the 06:00-14:00 IST window and "already done today"). Testing only.'
        type: boolean
        default: false
      validate_only:
        description: 'Job Agent: check saved setup and Google connections without searching, sending emails, or saving a checkpoint.'
        type: boolean
        default: false
      drafts_only:
        description: 'Job Agent: search and publish with outreach saved as drafts; send no outreach, follow-ups, or status emails.'
        type: boolean
        default: false
      apollo_enrichment_test:
        description: 'With validate only: also try one Apollo email lookup by name (uses 1 free Apollo credit).'
        type: boolean
        default: false
      link:
        description: 'Job Link: run it (once per IST day) in this run'
        type: boolean
        default: true
      link_force:
        description: 'Job Link: run even if it already ran today'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-job-run
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- Job Link (once per IST day)
      - name: Job Link - decide whether to run today
        id: day
        run: |
          echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.validate_only }}" = "true" ] || [ "${{ github.event.inputs.link }}" = "false" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Job Link - already ran today?
        id: marker
        if: steps.day.outputs.enabled == 'true' && github.event.inputs.link_force != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .link-done
          key: link-done-${{ steps.day.outputs.day }}
          lookup-only: true

      - name: Job Link - check setup
        id: gate
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ENABLED: ${{ steps.day.outputs.enabled }}
          DONE: ${{ steps.marker.outputs.cache-hit }}
        run: |
          if [ "$ENABLED" != "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DONE" = "true" ]; then echo "Job Link already ran today."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$VAULT_PASSPHRASE" ] || [ -z "$DATA_REPO_TOKEN" ]; then echo "Job Link skipped: add the VAULT_PASSPHRASE and DATA_REPO_TOKEN secrets (scripts/setup-public-repo.ps1)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Job Link - install
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Everything Job Link prints goes to link-run.log, never to this (public) log. Only exit codes are shown.
      - name: Job Link - run
        id: link
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO || 'mohank1234/job-link' }}
          LINKEDIN_COOKIES_B64: ${{ secrets.LINKEDIN_COOKIES_B64 }}
          JOB_LINK_SKIP_LINKEDIN: ${{ github.event.inputs.drafts_only == 'true' && '1' || '' }}
          JOB_LINK_DATA_REMOTE: data
        run: |
          set +e
          : > link-run.log
          step() { name="$1"; shift; "$@" >> link-run.log 2>&1; code=$?; echo "Job Link: $name exit $code"; return $code; }
          DATA_REPO_TOKEN=$(printf '%s' "$DATA_REPO_TOKEN" | tr -d '[:space:]')
          case "$DATA_REPO_TOKEN" in github_pat_*) kind="fine-grained";; ghp_*) kind="classic";; "") kind="EMPTY";; *) kind="unrecognised";; esac
          echo "Job Link: DATA_REPO_TOKEN is ${kind}, ${#DATA_REPO_TOKEN} characters"
          git remote add data "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git"
          mkdir -p vault
          # Only git's own error line is shown (token masked): it says whether the token is wrong, expired or lacks access to the data repository.
          if ! git fetch --depth=1 data main >> link-run.log 2>&1; then echo "Job Link: could not reach the private data repository:"; tail -n 2 link-run.log | sed -E 's#https://[^@ ]*@#https://***@#g'; exit 1; fi
          git show FETCH_HEAD:vault/private.enc > vault/private.enc 2>> link-run.log || { echo "Job Link: vault/private.enc is missing on the data repository's main branch"; exit 1; }
          step vault-open npx tsx src/cli.ts vault-open vault/private.enc || exit 1
          step state-pull npx tsx src/cli.ts state-pull --force
          step run npx tsx src/cli.ts run --headless
          RUN_CODE=$?
          if [ -n "$LINKEDIN_COOKIES_B64" ] && [ -z "$JOB_LINK_SKIP_LINKEDIN" ]; then step find-contacts npx tsx src/cli.ts find-contacts --headless --companies 5; fi
          step state-push npx tsx src/cli.ts state-push
          step export-excel npx tsx src/cli.ts export-excel
          step dashboard npx tsx src/cli.ts dashboard --offline
          npx tsx src/cli.ts digest > agent/link-digest.md 2>> link-run.log || : > agent/link-digest.md
          # The private data repository keeps the readable reports; nothing readable is published from this public repository.
          rm -rf .reports && mkdir .reports && cp reports/dashboard.html reports/job-outreach.xlsx link-run.log agent/link-digest.md .reports/ 2>/dev/null
          (cd .reports && git init -q && git add -A && git -c user.name=job-link -c user.email=job-link@users.noreply.github.com commit -q -m "reports $(date -u +%FT%TZ)" && git push -q --force "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" HEAD:refs/heads/reports) >> link-run.log 2>&1; echo "Job Link: reports exit $?"
          exit $RUN_CODE

      - name: Job Link - remember that it ran today
        if: steps.link.outcome == 'success'
        run: echo "${{ steps.day.outputs.day }}" > .link-done

      - name: Job Link - save the daily marker
        if: steps.link.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .link-done
          key: link-done-${{ steps.day.outputs.day }}

      # ---------------------------------------------------------------- Job Agent (agent/)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Job Agent - install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      # Same cache key and path as before the merge, so the saved state carries over.
      - name: Job Agent - restore encrypted persistent state
        uses: actions/cache/restore@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobagent-private-v1-

      - name: Job Agent - decrypt checkpoint
        working-directory: agent
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: |
          [ -f ../.jobagent-state.enc ] && cp ../.jobagent-state.enc .jobagent-state.enc || true
          python -m jobagent.cloud_state restore

      - name: Job Agent - write credentials and config from secrets
        working-directory: agent
        env:
          JOBAGENT_CONFIG_YAML: ${{ secrets.JOBAGENT_CONFIG_YAML }}
          JOBAGENT_PROFILE_YAML: ${{ secrets.JOBAGENT_PROFILE_YAML }}
          JOBAGENT_RESUME_DATA_PY: ${{ secrets.JOBAGENT_RESUME_DATA_PY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -eu
          printf '%s' "$JOBAGENT_CONFIG_YAML" > config.yaml
          printf '%s' "$JOBAGENT_PROFILE_YAML" > profile.yaml
          mkdir -p resume
          printf '%s' "$JOBAGENT_RESUME_DATA_PY" > resume/resume_data.py
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json
          printf '%s' "$DRIVE_TOKEN_JSON" > drive_token.json

      - name: Job Agent - validate setup and adopt reviewed state
        id: prepared
        working-directory: agent
        env:
          JOBAGENT_STATE_BOOTSTRAP_JSON: ${{ secrets.JOBAGENT_STATE_BOOTSTRAP_JSON }}
          JOBAGENT_REVIEWED_CONTACTS_JSON: ${{ secrets.JOBAGENT_REVIEWED_CONTACTS_JSON }}
        run: python -m jobagent.cloud_state prepare

      - name: Job Agent - check contact-provider keys
        if: github.event.inputs.validate_only == 'true'
        working-directory: agent
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET: ${{ secrets.TOMBA_SECRET }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.apollo_enrichment_test }}" = "true" ]; then
            python tools/check_contact_providers.py --apollo-enrichment
          else
            python tools/check_contact_providers.py
          fi

      - name: Job Agent - reset today's completion marker (manual force-run only)
        if: github.event.inputs.force_run == 'true' && github.event.inputs.validate_only != 'true'
        working-directory: agent
        run: python -c "import json,pathlib,shutil; from datetime import datetime,timezone,timedelta; p=pathlib.Path('research/morning-private/ledger.json'); d=json.loads(p.read_text()) if p.exists() else {'version':1,'days':{}}; key=(datetime.now(timezone.utc)+timedelta(hours=5,minutes=30)).date().isoformat(); d['days'].pop(key, None); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(d)); shutil.rmtree(p.parent / key, ignore_errors=True); print('reset', key)"

      - name: Job Agent - use drafts-only outreach for this run
        if: github.event.inputs.drafts_only == 'true' && github.event.inputs.validate_only != 'true'
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config.setdefault('outreach', {}).setdefault('gmail', {})['mode'] = 'draft_only'
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          print('Outreach drafts only; automatic sends and follow-ups disabled for this run.')
          PY

      - name: Job Agent - restore the cached local AI model
        id: model-cache
        if: github.event.inputs.validate_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-3b-v1

      - name: Job Agent - start the local AI model (Ollama)
        if: github.event.inputs.validate_only != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b
          ollama list

      - name: Job Agent - cache the local AI model
        if: github.event.inputs.validate_only != 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-3b-v1

      - name: Job Agent - use free services only
        if: github.event.inputs.validate_only != 'true'
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config['llm'] = {**(config.get('llm') or {}), 'provider': 'ollama', 'model': 'qwen2.5:3b',
                           'fallback_models': [], 'base_url': 'http://localhost:11434', 'think': None,
                           'num_ctx': 8192, 'max_tokens': 1500, 'timeout_seconds': 900,
                           'research_timeout_seconds': 300, 'max_prompt_chars': 16000,
                           'free_models_only': True, 'free_providers': ['ollama']}
          config.setdefault('billing', {})['allow_paid_services'] = False
          config.setdefault('outreach', {}).setdefault('gmail', {})['mode'] = 'draft_only'
          morning = config.setdefault('morning', {})
          morning['discovery_queries'] = []
          morning.setdefault('rotating_queries', 4)
          morning.setdefault('growth_queries', 2)
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          print('Free-only: local Ollama model, no paid services, web search within free credit; outreach saved as drafts only.')
          PY

      - name: Job Agent - run morning pipeline
        id: morning
        if: github.event.inputs.validate_only != 'true'
        working-directory: agent
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET: ${{ secrets.TOMBA_SECRET }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          ARGS=""
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="--initial"
          fi
          python run.py morning $ARGS 2>&1 | tee morning-run.log
          code=${PIPESTATUS[0]}
          set -e
          # 2 = "window_ended": the 14:00 IST deadline hit mid-run. Expected, not a failure; the next trigger resumes from the checkpoint.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      # The one email of the day: Job Agent's results, with the Job Link summary (agent/link-digest.md) appended when Job Link ran.
      - name: Send the daily results email (both systems)
        if: steps.morning.outcome == 'success' && github.event.inputs.validate_only != 'true' && github.event.inputs.drafts_only != 'true'
        working-directory: agent
        run: python tools/send_run_email.py

      - name: Job Agent - encrypt persistent state
        id: encrypted
        if: always() && steps.prepared.outcome == 'success' && github.event.inputs.validate_only != 'true'
        working-directory: agent
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: |
          python -m jobagent.cloud_state save
          cp .jobagent-state.enc ../.jobagent-state.enc

      - name: Job Agent - save encrypted state for next run
        if: always() && steps.encrypted.outcome == 'success' && github.event.inputs.validate_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Send failure alert email
        if: failure() && github.event.inputs.validate_only != 'true' && github.event.inputs.drafts_only != 'true'
        continue-on-error: true
        working-directory: agent
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/send_failure_alert.py
