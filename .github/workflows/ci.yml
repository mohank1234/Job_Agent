name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The real profile is private; the tests only need the same skills, experience and locations.
      - run: cp config/candidate.example.json config/candidate.json
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - name: No credentials or private files in what is published
        run: npx tsx src/cli.ts audit-public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Job Agent tests
        working-directory: agent
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
