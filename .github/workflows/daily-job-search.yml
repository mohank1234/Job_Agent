name: Daily job search

# Runs the same `python run.py morning` pipeline the laptop's Task Scheduler
# runs locally (see Install-Report-Schedule.ps1), but on GitHub's servers so
# it fires even when the laptop is off. It only ever creates Gmail DRAFTS and
# writes to the "JobAgent Output" Drive folder — nothing is ever sent
# automatically; review and send by hand when you're back.
#
# in_window() in jobagent/morning.py restricts real work to 06:00-11:00 IST
# regardless of the runner's own timezone, so multiple triggers below are
# safe: only the first one each day does the run, the rest resume checkpoints
# or no-op via the ledger in research/morning-private/.
on:
  schedule:
    - cron: '30 0 * * *'  # 06:00 IST - primary run
    - cron: '0 3 * * *'   # 08:30 IST - catch-up if the primary run failed/skipped
    - cron: '0 5 * * *'   # 10:30 IST - last-chance catch-up before the window closes
  workflow_dispatch: {}    # manual "Run workflow" button for on-demand runs

permissions:
  contents: read

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted persistent state
        uses: actions/cache/restore@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobagent-private-v1-

      - name: Decrypt checkpoint
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: python -m jobagent.cloud_state restore

      - name: Write credentials and config from secrets
        env:
          JOBAGENT_CONFIG_YAML: ${{ secrets.JOBAGENT_CONFIG_YAML }}
          JOBAGENT_PROFILE_YAML: ${{ secrets.JOBAGENT_PROFILE_YAML }}
          JOBAGENT_RESUME_DATA_PY: ${{ secrets.JOBAGENT_RESUME_DATA_PY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -eu
          printf '%s' "$JOBAGENT_CONFIG_YAML" > config.yaml
          printf '%s' "$JOBAGENT_PROFILE_YAML" > profile.yaml
          mkdir -p resume
          printf '%s' "$JOBAGENT_RESUME_DATA_PY" > resume/resume_data.py
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json
          printf '%s' "$DRIVE_TOKEN_JSON" > drive_token.json

      - name: One-time bootstrap - adopt corrected checkpoint (TEMPORARY, remove after first clean run)
        run: python tools/ci_bootstrap_seed.py 1SVyYlmycA2gZWDEcJNoHAWQu5O6Z85y0

      - name: Validate setup and adopt reviewed state
        id: prepared
        env:
          JOBAGENT_STATE_BOOTSTRAP_JSON: ${{ secrets.JOBAGENT_STATE_BOOTSTRAP_JSON }}
          JOBAGENT_REVIEWED_CONTACTS_JSON: ${{ secrets.JOBAGENT_REVIEWED_CONTACTS_JSON }}
        run: python -m jobagent.cloud_state prepare

      - name: Run morning pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python run.py morning 2>&1 | tee morning-run.log
          code=${PIPESTATUS[0]}
          set -e
          # 2 = "window_ended": the 11:00 IST deadline hit mid-run. Expected
          # and not a failure - the next scheduled trigger resumes from the
          # checkpoint.
          #
          # Publication failures remain visible and resumable. Do not report
          # success when the user's Drive report was not updated.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Encrypt persistent state
        id: encrypted
        if: always() && steps.prepared.outcome == 'success'
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: python -m jobagent.cloud_state save

      - name: Save encrypted state for next run
        if: always() && steps.encrypted.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
