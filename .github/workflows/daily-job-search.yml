name: Daily job search

# Runs the same `python run.py morning` pipeline the laptop's Task Scheduler
# runs locally (see Install-Report-Schedule.ps1), but on GitHub's servers so
# it fires even when the laptop is off. Outreach follows the configured Gmail
# mode; manual drafts_only runs save drafts and update "JobAgent Output"
# without sending outreach, follow-ups, or status emails.
# Separately, a same-account status email (real results, no outreach) is
# sent to yourself each day real work completes - see jobagent/notify.py.
#
# in_window() in jobagent/morning.py restricts real work to 06:00-11:00 IST
# regardless of the runner's own timezone, so multiple triggers below are
# safe: only the first one each day does the run, the rest resume checkpoints
# or no-op via the ledger in research/morning-private/.
on:
  schedule:
    - cron: '30 0 * * *'  # 06:00 IST - primary run
    - cron: '0 3 * * *'   # 08:30 IST - catch-up if the primary run failed/skipped
    - cron: '0 5 * * *'   # 10:30 IST - last-chance catch-up before the window closes
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force a real run right now (ignore the 06:00-11:00 IST window and "already done today" check). Testing only.'
        type: boolean
        default: false
      validate_only:
        description: 'Check saved setup and Google connections without searching, sending emails, or saving a checkpoint.'
        type: boolean
        default: false
      drafts_only:
        description: 'Search and publish with outreach saved as drafts; send no outreach, follow-ups, or status emails.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted persistent state
        uses: actions/cache/restore@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobagent-private-v1-

      - name: Decrypt checkpoint
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: python -m jobagent.cloud_state restore

      - name: Write credentials and config from secrets
        env:
          JOBAGENT_CONFIG_YAML: ${{ secrets.JOBAGENT_CONFIG_YAML }}
          JOBAGENT_PROFILE_YAML: ${{ secrets.JOBAGENT_PROFILE_YAML }}
          JOBAGENT_RESUME_DATA_PY: ${{ secrets.JOBAGENT_RESUME_DATA_PY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -eu
          printf '%s' "$JOBAGENT_CONFIG_YAML" > config.yaml
          printf '%s' "$JOBAGENT_PROFILE_YAML" > profile.yaml
          mkdir -p resume
          printf '%s' "$JOBAGENT_RESUME_DATA_PY" > resume/resume_data.py
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json
          printf '%s' "$DRIVE_TOKEN_JSON" > drive_token.json

      - name: Validate setup and adopt reviewed state
        id: prepared
        env:
          JOBAGENT_STATE_BOOTSTRAP_JSON: ${{ secrets.JOBAGENT_STATE_BOOTSTRAP_JSON }}
          JOBAGENT_REVIEWED_CONTACTS_JSON: ${{ secrets.JOBAGENT_REVIEWED_CONTACTS_JSON }}
        run: python -m jobagent.cloud_state prepare

      - name: Reset today's completion marker (manual force-run only)
        if: github.event.inputs.force_run == 'true' && github.event.inputs.validate_only != 'true'
        # Also clears today's saved searches, so a forced run searches afresh
        # instead of replaying this morning's checkpoints.
        run: python -c "import json,pathlib,shutil; from datetime import datetime,timezone,timedelta; p=pathlib.Path('research/morning-private/ledger.json'); d=json.loads(p.read_text()) if p.exists() else {'version':1,'days':{}}; key=(datetime.now(timezone.utc)+timedelta(hours=5,minutes=30)).date().isoformat(); d['days'].pop(key, None); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(d)); shutil.rmtree(p.parent / key, ignore_errors=True); print('reset', key)"

      - name: Use drafts-only outreach for this run
        if: github.event.inputs.drafts_only == 'true' && github.event.inputs.validate_only != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config.setdefault('outreach', {}).setdefault('gmail', {})['mode'] = 'draft_only'
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          print('Outreach drafts only; automatic sends and follow-ups disabled for this run.')
          PY

      # Zero cost: the AI model runs on this GitHub machine (free for a public
      # repository) instead of a hosted API, and pay-per-use services are off.
      - name: Restore the cached local AI model
        id: model-cache
        if: github.event.inputs.validate_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-3b-v1

      - name: Start the local AI model (Ollama)
        if: github.event.inputs.validate_only != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b
          ollama list

      # Saved right after download, so a later failure does not force the
      # next run to download the model again.
      - name: Cache the local AI model
        if: github.event.inputs.validate_only != 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-3b-v1

      - name: Use free services only
        if: github.event.inputs.validate_only != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config['llm'] = {**(config.get('llm') or {}), 'provider': 'ollama', 'model': 'qwen2.5:3b',
                           'fallback_models': [], 'base_url': 'http://localhost:11434', 'think': None,
                           'num_ctx': 8192, 'max_tokens': 1500, 'timeout_seconds': 900,
                           'research_timeout_seconds': 300, 'max_prompt_chars': 16000,
                           'free_models_only': True, 'free_providers': ['ollama']}
          config.setdefault('billing', {})['allow_paid_services'] = False
          morning = config.setdefault('morning', {})
          # Web search is held inside Exa's free monthly credit; spend it on
          # the rotating profile searches rather than the same fixed ones.
          morning['discovery_queries'] = []
          morning.setdefault('rotating_queries', 4)
          morning.setdefault('growth_queries', 2)
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          print('Free-only: local Ollama model, no paid services, web search within free credit.')
          PY

      - name: Run morning pipeline
        id: morning
        if: github.event.inputs.validate_only != 'true'
        # Only the free-credit web search key is given to the run. The Apify,
        # Gemini and Firecrawl keys are deliberately absent, so no code path
        # can reach a paid service.
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          ARGS=""
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="--initial"
          fi
          python run.py morning $ARGS 2>&1 | tee morning-run.log
          code=${PIPESTATUS[0]}
          set -e
          # 2 = "window_ended": the 11:00 IST deadline hit mid-run. Expected
          # and not a failure - the next scheduled trigger resumes from the
          # checkpoint.
          #
          # Publication failures remain visible and resumable. Do not report
          # success when the user's Drive report was not updated.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Send daily results email
        if: steps.morning.outcome == 'success' && github.event.inputs.validate_only != 'true' && github.event.inputs.drafts_only != 'true'
        run: python tools/send_run_email.py

      - name: Encrypt persistent state
        id: encrypted
        if: always() && steps.prepared.outcome == 'success' && github.event.inputs.validate_only != 'true'
        env:
          JOBAGENT_STATE_KEY: ${{ secrets.JOBAGENT_STATE_KEY }}
        run: python -m jobagent.cloud_state save

      - name: Save encrypted state for next run
        if: always() && steps.encrypted.outcome == 'success' && github.event.inputs.validate_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: .jobagent-state.enc
          key: jobagent-private-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Best-effort: if the failure is the Gmail token itself being broken,
      # this alert needs that same token and will fail to send too. GitHub's
      # own built-in "failed workflow run" email notification (account
      # Settings -> Notifications -> Actions) is the independent backup for
      # exactly that case.
      - name: Send failure alert email
        if: failure() && github.event.inputs.validate_only != 'true' && github.event.inputs.drafts_only != 'true'
        continue-on-error: true
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/send_failure_alert.py
