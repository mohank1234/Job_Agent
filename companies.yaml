# Target company ATS boards.
#
# Every slug below was probed live and returned postings. Re-check periodically:
#
#     python run.py verify
#
# How to find a company's slug: open their careers page and look at the URL of
# a job posting.
#   boards.greenhouse.io/SLUG/jobs/123      -> greenhouse, slug = SLUG
#   jobs.lever.co/SLUG/uuid                 -> lever
#   jobs.ashbyhq.com/SLUG/uuid              -> ashby
#   careers.smartrecruiters.com/SLUG/123    -> smartrecruiters
#   apply.workable.com/SLUG/j/ABC123        -> workable
#
# These five vendors are public, documented JSON APIs. They are the only
# legitimate programmatic route to job data — Naukri, LinkedIn, Indeed,
# Foundit, Cutshort, Instahyre, Hirist, Glassdoor and TimesJobs have no public
# API and prohibit automated access in their terms.

